
services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      APP_SECRET: "${APP_SECRET:-pkmnsheet-local-development-secret}"
      DATABASE_URL: "mysql://${MYSQL_USER:-MKurai}:${MYSQL_PASSWORD:-1234}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8.4}&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}"
      - "traefik.http.routers.pkmnsheet.rule=Host(`pkmnsheet.localhost`)"
      - "traefik.http.routers.pkmnsheet.entrypoints=web"
      - "traefik.http.services.pkmnsheet.loadbalancer.server.port=80"
    networks:
      - default
      - traefik

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pkmnsheet}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-MKurai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}" ]
      timeout: 5s
      retries: 5
      start_period: 60s

      # A bind mount is an alternative if you prefer to keep database files in the project directory.
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  mysql_data:
    name: pkmnsheet_mysql_data
###< doctrine/doctrine-bundle ###

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_network}
